services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    environment:
      - PYTHONUNBUFFERED=1
      - CORS_ORIGINS=http://localhost:3000
      - ADMIN_USERNAME=mirek
      - ADMIN_PASSWORD=changeme123
      # V produkci si nastav vlastní náhodný SECRET_KEY!
      - SECRET_KEY=change-me-in-production-please
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      # anonymní volume - ať node_modules v kontejneru
      # nepřepíše mount tvého lokálního (nebo neexistujícího) node_modules
      - /app/node_modules
    environment:
      - CHOKIDAR_USEPOLLING=true
      - VITE_API_URL=http://localhost:8000
    depends_on:
      - backend
    restart: unless-stopped
